name: Publish

# A GitHub release tagged v<version> publishes that version of `acpantenna`
# to npm, and @acpantenna/relay-protocol's version if it is not there yet.
# Run by hand, it publishes whichever of the two versions npm does not have.
# release.yml calls it with the tag it made: a release made by the workflow's
# own token starts no other workflow. Needs the NPM_TOKEN secret: an npm token
# that can publish both.
on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The tag to publish, v<version>.
        type: string
        required: true
      ci:
        description: Run CI first. The caller may have just run it.
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    if: ${{ inputs.ci != false }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: The tag is the package's version
        if: github.event_name == 'release' || inputs.ref
        working-directory: npm/acpantenna
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${TAG}" = "v${version}" || {
            echo "Release tag ${TAG} does not match package version ${version}."
            exit 1
          }

      # The protocol first: a web client may need it before the CLI that speaks it.
      - name: Publish @acpantenna/relay-protocol
        working-directory: packages/relay-protocol
        run: ../../npm/acpantenna/scripts/publish-once.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish acpantenna
        working-directory: npm/acpantenna
        run: scripts/publish-once.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
