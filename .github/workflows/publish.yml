name: Publish

# A GitHub release tagged v<version> publishes that version of `acpantenna`
# to npm, and @acpantenna/relay-protocol's version if it is not there yet.
# Run by hand, it publishes whichever of the two versions npm does not have.
# Needs the NPM_TOKEN secret: an npm token that can publish both.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: The tag is the package's version
        if: github.event_name == 'release'
        working-directory: npm/acpantenna
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${version}."
            exit 1
          }

      # The protocol first: a web client may need it before the CLI that speaks it.
      - name: Publish @acpantenna/relay-protocol
        working-directory: packages/relay-protocol
        run: ../../npm/acpantenna/scripts/publish-once.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish acpantenna
        working-directory: npm/acpantenna
        run: scripts/publish-once.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
