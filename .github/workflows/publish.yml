name: Publish

# A GitHub release tagged v<version> publishes that version of `acpantenna`
# to npm. Needs the NPM_TOKEN secret: an npm automation token.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: The tag is the package's version
        working-directory: npm/acpantenna
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${version}."
            exit 1
          }

      - name: Publish
        working-directory: npm/acpantenna
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
