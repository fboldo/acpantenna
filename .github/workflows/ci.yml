name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Format, Check, Typecheck & Test
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Biome check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # The package tests and the end-to-end tests (gateway, connect, the CLI
  # with its background server) on each OS acpantenna runs on.
  os:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package tests
        run: bun run test -- --continue

      - name: End-to-end tests
        if: ${{ !cancelled() }}
        run: bun test tests

  package:
    name: npm package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack
        working-directory: npm/acpantenna
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # What `npx acpantenna` does on a machine without Bun: Node only on
      # PATH, so the launcher has to find the Bun the package brought.
      - name: Install and run with Node only
        run: |
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm install --no-audit --no-fund "$RUNNER_TEMP"/acpantenna-*.tgz
          export PATH="$(dirname "$(command -v node)"):/usr/bin:/bin"
          if command -v bun; then echo "bun is still on PATH"; exit 1; fi
          npx acpantenna --help
          npx acpantenna channels --json | node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")); if (d.version !== 1 || !d.channels.some((c) => c.type === "matrix")) process.exit(1)'
