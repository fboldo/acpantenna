name: Release

# Run by hand from main: moves acpantenna and @acpantenna/relay-protocol to the
# next version (they are released together), commits that to main, tags
# v<version>, makes the GitHub release with notes from the merged pull
# requests, and starts publish.yml on the tag to put both on npm.
on:
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major, or an exact version such as 0.3.0
        required: true
        default: patch

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump the versions
        id: bump
        env:
          BUMP: ${{ inputs.version }}
        run: |
          version="$(node npm/acpantenna/scripts/bump-version.mjs "$BUMP")"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "The tag ${tag} already exists."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag}"

      # bun.lock records the workspace packages' versions.
      - name: Update the lockfile
        run: bun install

      - name: Commit and tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npm/acpantenna/package.json packages/relay-protocol/package.json bun.lock
          git commit -m "release: ${TAG}"
          git tag -a "${TAG}" -m "${TAG}"
          # Both or neither: main moved on meanwhile means run it again.
          git push --atomic origin HEAD:main "refs/tags/${TAG}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes

  # Started as its own run rather than called: npm trusts publish.yml as the
  # publisher, and a called workflow would publish as release.yml. A run
  # started by workflow_dispatch is the one event this workflow's token may
  # start.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start publish.yml on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run publish.yml --repo "${{ github.repository }}" --ref "${TAG}"
